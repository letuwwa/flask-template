services:
  backend:
    build:
      context: .
      args:
        PYTHON_VERSION: "3.14"
    ports:
      - "127.0.0.1:5000:5000"
    environment:
      DATABASE_URL: postgresql://postgres:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@database:5432/flask_template
      SECRET_KEY: ${SECRET_KEY:?Set SECRET_KEY}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:-${SECRET_KEY}}
      FLASK_DEBUG: "${FLASK_DEBUG:-false}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:3000,http://127.0.0.1:3000}"
      RATELIMIT_STORAGE_URI: "${RATELIMIT_STORAGE_URI:-memory://}"
    depends_on:
      database:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:5000/', timeout=2)",
        ]
      interval: 10s
      timeout: 5s
      retries: 6

  database:
    image: postgres:17
    environment:
      POSTGRES_DB: flask_template
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
      POSTGRES_USER: postgres
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d flask_template"]
      interval: 5s
      timeout: 5s
      retries: 12
